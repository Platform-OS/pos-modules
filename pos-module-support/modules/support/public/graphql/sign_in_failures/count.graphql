query ($email_digest: String!, $since: String!, $up_to_id: ID) {
  records(
    per_page: 1
    filter: {
      id: { range: { lte: $up_to_id } }
      table: { value: "modules/support/sign_in_failure" }
      properties: [{ name: "email_digest", value: $email_digest }]
      created_at: { gte: $since }
    }
  ) {
    total_entries
  }
}
