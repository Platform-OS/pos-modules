query search(
  $limit: Int = 20
  $page: Int = 1
  $status: String
) {
  invite_csvs: records(
    per_page: $limit
    page: $page
    filter: {
      table: { value: "modules/user_invites/invite_csv" }
      properties: [
        { name: "status", value: $status }
      ]
    }
    sort: [{ created_at: { order: DESC } }]
  ) {
    total_entries
    total_pages
    has_next_page
    current_page
    results {
      id
      created_at
      updated_at
      filename: property(name: "filename")
      status: property(name: "status")
      created_by_id: property(name: "created_by_id")
      sent_at: property(name: "sent_at")
    }
  }
}
