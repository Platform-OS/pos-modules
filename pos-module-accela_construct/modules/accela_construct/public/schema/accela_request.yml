# Table logging one row per logical Accela request this module makes -
# created once, on that request's first attempt. See
# lib/accela_client/log_request.liquid. Each request may have multiple
# accela_request_response rows (one per attempt, including background
# retries) - see accela_request_response.yml. How many attempts a
# request has had is derived from that table (filter accela_request_response
# by request_id and read total_entries - see queries/accela_request_response/list),
# not stored here.
name: accela_request
properties:
  - name: caller
    type: string           # the calling query/command's own module path, e.g.
                           # 'modules/accela_construct/commands/inspections/schedule' -
                           # lets a accela_construct_request_succeeded consumer branch on
                           # which endpoint succeeded, including on a background retry
  - name: method
    type: string
  - name: path
    type: string
  - name: request_payload
    type: string
  - name: reference_id
    type: string          # optional polymorphic association to a caller-defined object
  - name: reference_schema
    type: string          # the platformOS table reference_id's row lives in (a real Record.table
                           # value, not a caller-invented label) - see log_request.liquid
  - name: metadata
    type: string          # optional caller-supplied JSON hash, opaque to this module -
                           # stored/read via value_json/property_json (see graphql/accela_request/*)
