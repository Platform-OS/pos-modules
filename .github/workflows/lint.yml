name: Lint modules
run-name: ${{ inputs.module && format('Lint {0}', inputs.module) || ' ' }}

on:
  push:
    paths-ignore:
      - "**/README.md"
  workflow_dispatch:
    inputs:
      modules:
        description: 'Modules to lint (comma-separated or "all" for all modules)'
        required: false
        default: 'all'
        type: string

jobs:
  pre_job:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@master
        with:
          github_token: ${{ github.token }}
          paths_ignore: '["**/README.md"]'
          do_not_skip: '["push", "workflow_dispatch"]'

  detect-changes:
    needs: pre_job
    if: ${{ github.event_name != 'workflow_dispatch' && needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    outputs:
      changed-modules: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          base: ${{ github.event.before }}
          ref: ${{ github.event.after }}
          filters: |
            payments:
              - 'pos-module-payments/**'
            user:
              - 'pos-module-user/**'
            chat:
              - 'pos-module-chat/**'
            common-styling:
              - 'pos-module-common-styling/**'
            tests:
              - 'pos-module-tests/**'
            core:
              - 'pos-module-core/**'
            oauth-facebook:
              - 'pos-module-oauth-facebook/**'
            oauth-github:
              - 'pos-module-oauth-github/**'
            oauth-google:
              - 'pos-module-oauth-google/**'
            openai:
              - 'pos-module-openai/**'
            reports:
              - 'pos-module-reports/**'
            data-export-api:
              - 'pos-module-data-export-api/**'
            payments-stripe:
              - 'pos-module-payments-stripe/**'
            payments-example-gateway:
              - 'pos-module-payments-example-gateway/**'

      - name: Set matrix for changed modules
        id: set-matrix
        run: |
          # Check if this is a manual trigger
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger detected"
            manual_input="${{ github.event.inputs.modules }}"
            echo "Manual input: $manual_input"

            if [ "$manual_input" = "all" ] || [ -z "$manual_input" ]; then
              # Dynamically discover all modules
              modules=$(ls -d pos-module-*/ | sed 's|pos-module-||g; s|/||g' | jq -R -s -c 'split("\n") | map(select(length > 0))')
            else
              # Parse comma-separated list, strip pos-module- prefix, and create array
              modules=$(echo "$manual_input" | jq -R -c 'split(",") | map(gsub("^\\s+|\\s+$"; "") | gsub("^pos-module-"; ""))')
            fi
            echo "Manual trigger modules: $modules"
          else
            # Automatic detection from git changes
            changes='${{ steps.filter.outputs.changes }}'
            echo "Detected changes: $changes"
            modules="$changes"
            echo "Changed modules for linting: $modules"
          fi

          echo "matrix=$modules" >> $GITHUB_OUTPUT

  run-linter:
      needs: [pre_job, detect-changes]
      if: |
        needs.pre_job.outputs.should_skip != 'true' &&
        needs.detect-changes.result == 'success' &&
        needs.detect-changes.outputs.changed-modules != '[]'
      runs-on: ubuntu-latest
      strategy:
        matrix:
          module: ${{ fromJSON(needs.detect-changes.outputs.changed-modules) }}
        fail-fast: false
      env:
        CI: true
        LOGS_DIR: ${{ github.workspace }}/pos-module-${{ matrix.module }}/logs
      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up Node.js
          uses: actions/setup-node@v3
          with:
            node-version: '22'

        - name: Install pos-cli
          id: install_pos_cli
          run: npm install -g @platformos/pos-cli@latest

        - name: Set up logs directory
          if: steps.install_pos_cli.outcome == 'success'
          run: |
            mkdir -p ${{ env.LOGS_DIR }}
            chmod -R 777 ${{ env.LOGS_DIR }}

        # - name: Install modules
        #   if: steps.install_pos_cli.outcome == 'success'
        #   run: |
        #     cd pos-module-${{ matrix.module }}
        #     mkdir -p app
        #     pos-cli modules install

        - name: Run pos-cli check
          if: steps.install_pos_cli.outcome == 'success'
          id: run_check
          run: |
            set +e  # Disable exit on error
            pos-cli check run pos-module-${{ matrix.module }} -f json > ${{ env.LOGS_DIR }}/platformos-check-raw.json
            check_exit_code=$?  # Capture the exit code
            set -e  # Re-enable exit on error

            jq . ${{ env.LOGS_DIR }}/platformos-check-raw.json | tee ${{ env.LOGS_DIR }}/platformos-check.json

            exit $check_exit_code

        - name: Upload logs
          if: always() && steps.run_check.outcome != 'skipped'
          uses: actions/upload-artifact@v4
          with:
            name: platformos_check_logs_${{ matrix.module }}_${{ github.run_id }}
            path: |
              ${{ env.LOGS_DIR }}/platformos-check.json
              ${{ env.LOGS_DIR }}/platformos-check-raw.json

        - name: Generate summary
          if: always() && steps.run_check.outcome != 'skipped'
          run: |
            echo "# PlatformOS Check Summary - ${{ matrix.module }} :checkered_flag:" >> $GITHUB_STEP_SUMMARY
            echo "## Result: ${{ steps.run_check.outcome }} ${{ env.RESULT_ICON }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            if [ -f "${{ env.LOGS_DIR }}/platformos-check.json" ]; then
              JSON="${{ env.LOGS_DIR }}/platformos-check.json"

              # Summary statistics
              echo "## Summary" >> $GITHUB_STEP_SUMMARY
              echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
              echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
              jq -r '"| Total Offenses | \(.offenseCount) |", "| Files with Issues | \(.fileCount) |", "| Errors | \(.errorCount) |", "| Warnings | \(.warningCount) |", "| Info | \(.infoCount) |"' "$JSON" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY

              # Offenses by check type
              echo "## Offenses by Check Type" >> $GITHUB_STEP_SUMMARY
              echo "| Check | Total | Errors | Warnings |" >> $GITHUB_STEP_SUMMARY
              echo "|-------|-------|--------|----------|" >> $GITHUB_STEP_SUMMARY
              jq -r '
                [.files[].offenses[]] | group_by(.check)
                | map({
                    check: .[0].check,
                    total: length,
                    errors: map(select(.severity == "error")) | length,
                    warnings: map(select(.severity == "warning")) | length
                  })
                | sort_by(-.total)
                | .[]
                | "| `\(.check)` | \(.total) | \(.errors) | \(.warnings) |"
              ' "$JSON" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY

              # Errors section — full detail for files with errors
              ERROR_FILE_COUNT=$(jq '[.files[] | select(.errorCount > 0)] | length' "$JSON")
              if [ "$ERROR_FILE_COUNT" -gt 0 ]; then
                echo "## Errors ($ERROR_FILE_COUNT files)" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                jq -r '
                  [.files[] | select(.errorCount > 0)]
                  | sort_by(-.errorCount)
                  | .[]
                  | "### \u274c `\(.path)`",
                    "",
                    "**Errors:** \(.errorCount) | **Warnings:** \(.warningCount)",
                    "",
                    "| Line | Col | Severity | Check | Message |",
                    "|------|-----|----------|-------|---------|",
                    (.offenses | sort_by(
                      (if .severity == "error" then 0 elif .severity == "warning" then 1 else 2 end),
                      .start_row
                    ) | .[] | "| \(.start_row) | \(.start_column) | \(.severity) | `\(.check)` | \(.message | gsub("\n"; " ")) |"),
                    ""
                ' "$JSON" >> $GITHUB_STEP_SUMMARY
              fi

              # Warnings section — collapsed, only top files shown
              WARNING_ONLY_COUNT=$(jq '[.files[] | select(.errorCount == 0 and .warningCount > 0)] | length' "$JSON")
              if [ "$WARNING_ONLY_COUNT" -gt 0 ]; then
                TOTAL_WARNINGS=$(jq '.warningCount' "$JSON")
                echo "<details>" >> $GITHUB_STEP_SUMMARY
                echo "<summary>## Warnings — ${TOTAL_WARNINGS} across ${WARNING_ONLY_COUNT} files (click to expand)</summary>" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY

                # Show top 20 files by warning count
                jq -r '
                  [.files[] | select(.errorCount == 0 and .warningCount > 0)]
                  | sort_by(-.warningCount)
                  | .[:20]
                  | .[]
                  | "### \u26a0\ufe0f `\(.path)` — \(.warningCount) warnings",
                    "",
                    "| Line | Col | Check | Message |",
                    "|------|-----|-------|---------|",
                    (.offenses | sort_by(.start_row)
                    | .[] | "| \(.start_row) | \(.start_column) | `\(.check)` | \(.message | gsub("\n"; " ")) |"),
                    ""
                ' "$JSON" >> $GITHUB_STEP_SUMMARY

                REMAINING=$((WARNING_ONLY_COUNT - 20))
                if [ "$REMAINING" -gt 0 ]; then
                  echo "...and ${REMAINING} more files with warnings only." >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                fi

                echo "</details>" >> $GITHUB_STEP_SUMMARY
              fi
            else
              echo "## No output file found" >> $GITHUB_STEP_SUMMARY
              echo "Expected location: ${{ env.LOGS_DIR }}/platformos-check.json" >> $GITHUB_STEP_SUMMARY
            fi
          env:
            RESULT_ICON: ${{ steps.run_check.outcome == 'success' && ':white_check_mark:' || ':x:' }}

        - name: Fail job if platformos-check failed
          if: always() && steps.run_check.outcome == 'failure'
          run: |
            echo "platformos-check failed — marking job as failed"
            exit 1

  conclusion:
    needs: [detect-changes, run-linter]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate workflow summary
        run: |
          if [ "${{ needs.detect-changes.outputs.changed-modules }}" = "[]" ] || [ "${{ needs.detect-changes.result }}" = "skipped" ]; then
            echo "## Linting - Skipped" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ "${{ needs.detect-changes.result }}" = "skipped" ]; then
              echo "Workflow was skipped by duplicate action check." >> $GITHUB_STEP_SUMMARY
            elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "Manual trigger with no matching modules selected." >> $GITHUB_STEP_SUMMARY
            else
              echo "No modules were changed in this push." >> $GITHUB_STEP_SUMMARY
            fi
          else
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "## Linting - Completed (Manual Trigger)" >> $GITHUB_STEP_SUMMARY
            else
              echo "## Linting - Completed" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Linting ran for the following modules:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo '${{ needs.detect-changes.outputs.changed-modules }}' | jq -r '.[] | "- " + .' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ "${{ needs.run-linter.result }}" = "success" ]; then
              echo "Result: All checks passed" >> $GITHUB_STEP_SUMMARY
            elif [ "${{ needs.run-linter.result }}" = "skipped" ]; then
              echo "Result: Linting was skipped" >> $GITHUB_STEP_SUMMARY
            else
              echo "Result: Some checks failed - see job output for details" >> $GITHUB_STEP_SUMMARY
            fi
          fi
