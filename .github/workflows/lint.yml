name: Lint modules
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Lint: {0}', inputs.module) || github.event_name == 'pull_request' && format('Lint PR #{0}', github.event.pull_request.number) || format('Lint: {0}', github.ref_name) }}

on:
  pull_request:
    branches: [ master ]
    paths-ignore:
      - "**/README.md"
  push:
    paths-ignore:
      - "**/README.md"
  workflow_dispatch:
    inputs:
      module:
        description: 'Module to lint (e.g., common-styling, user, chat)'
        required: true
        type: choice
        options:
          - chat
          - common-styling
          - core
          - data-export-api
          - oauth-facebook
          - oauth-github
          - oauth-google
          - openai
          - payments
          - payments-example-gateway
          - payments-stripe
          - reports
          - tests
          - user

jobs:
  pre_job:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@master
        with:
          github_token: ${{ github.token }}
          paths_ignore: '["**/README.md"]'
          do_not_skip: '["push"]'

  detect-changes:
    needs: pre_job
    if: ${{ github.event_name != 'workflow_dispatch' && needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    outputs:
      changed-modules: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            payments:
              - 'pos-module-payments/**'
            user:
              - 'pos-module-user/**'
            chat:
              - 'pos-module-chat/**'
            common-styling:
              - 'pos-module-common-styling/**'
            tests:
              - 'pos-module-tests/**'
            core:
              - 'pos-module-core/**'
            oauth-facebook:
              - 'pos-module-oauth-facebook/**'
            oauth-github:
              - 'pos-module-oauth-github/**'
            oauth-google:
              - 'pos-module-oauth-google/**'
            openai:
              - 'pos-module-openai/**'
            reports:
              - 'pos-module-reports/**'
            data-export-api:
              - 'pos-module-data-export-api/**'
            payments-stripe:
              - 'pos-module-payments-stripe/**'
            payments-example-gateway:
              - 'pos-module-payments-example-gateway/**'

      - name: Set matrix for changed modules
        id: set-matrix
        run: |
          # Extract module names where filter output is "true"
          modules=$(echo '${{ toJSON(steps.filter.outputs) }}' | jq -c '[to_entries[] | select(.value == "true") | .key]')

          echo "matrix=$modules" >> $GITHUB_OUTPUT
          echo "Changed modules for linting: $modules"

  run-linter:
    needs: [detect-changes]
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       needs.detect-changes.outputs.changed-modules != '[]')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.module)) || fromJSON(needs.detect-changes.outputs.changed-modules) }}
      fail-fast: false
    env:
      CI: true
      LOGS_DIR: ${{ github.workspace }}/pos-module-${{ matrix.module }}/logs
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install pos-cli
        id: install_pos_cli
        run: npm install -g @platformos/pos-cli@latest

      - name: Set up logs directory
        run: |
          mkdir -p ${{ env.LOGS_DIR }}
          chmod -R 777 ${{ env.LOGS_DIR }}

      - name: Run pos-cli check
        if: steps.install_pos_cli.outcome == 'success'
        id: run_check
        run: |
          set +e  # Disable exit on error
          pos-cli check run pos-module-${{ matrix.module }} -f json > ${{ env.LOGS_DIR }}/platformos-check-raw.json
          check_exit_code=$?  # Capture the exit code
          set -e  # Re-enable exit on error

          jq . ${{ env.LOGS_DIR }}/platformos-check-raw.json | tee ${{ env.LOGS_DIR }}/platformos-check.json

          exit $check_exit_code

      - name: Upload logs
        if: always() && steps.run_check.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: platformos_check_logs_${{ matrix.module }}_${{ github.run_id }}
          path: |
            ${{ env.LOGS_DIR }}/platformos-check.json
            ${{ env.LOGS_DIR }}/platformos-check-raw.json

      - name: Generate summary
        if: always() && steps.run_check.outcome != 'skipped'
        run: |
          echo "# PlatformOS Check Summary - ${{ matrix.module }} :checkered_flag:" >> $GITHUB_STEP_SUMMARY
          echo "## Result: ${{ steps.run_check.outcome }} ${{ env.RESULT_ICON }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "${{ env.LOGS_DIR }}/platformos-check.json" ]; then
            # Extract and display summary statistics
            echo "## Summary" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            jq -r '"| Total Offenses | \(.offenseCount) |", "| Files with Issues | \(.fileCount) |", "| Errors | \(.errorCount) |", "| Warnings | \(.warningCount) |", "| Info | \(.infoCount) |"' ${{ env.LOGS_DIR }}/platformos-check.json >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            echo "## Issues Found" >> $GITHUB_STEP_SUMMARY
            echo "| File | Line | Column | Severity | Check | Message |" >> $GITHUB_STEP_SUMMARY
            echo "|------|------|--------|----------|-------|---------|" >> $GITHUB_STEP_SUMMARY

            # Try to parse and add issues
            if jq -r '.files[] | .path as $file | .offenses[] | "| \($file) | \(.start_row) | \(.start_column) | \(.severity) | \(.check) | \(.message) |"' ${{ env.LOGS_DIR }}/platformos-check.json >> $GITHUB_STEP_SUMMARY 2>&1; then
              echo "Issues table generated successfully"
            else
              echo "| N/A | N/A | N/A | N/A | N/A | Failed to parse JSON - see logs for details |" >> $GITHUB_STEP_SUMMARY
              echo "JSON parse error. File contents:" >> $GITHUB_STEP_SUMMARY
              echo '```json' >> $GITHUB_STEP_SUMMARY
              cat ${{ env.LOGS_DIR }}/platformos-check.json >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "## No output file found" >> $GITHUB_STEP_SUMMARY
            echo "Expected location: ${{ env.LOGS_DIR }}/platformos-check.json" >> $GITHUB_STEP_SUMMARY
          fi
        env:
          RESULT_ICON: ${{ steps.run_check.outcome == 'success' && ':white_check_mark:' || ':x:' }}

      - name: Fail job if platformos-check failed
        if: always() && steps.run_check.outcome == 'failure'
        run: |
          echo "platformos-check failed — marking job as failed"
          exit 1
