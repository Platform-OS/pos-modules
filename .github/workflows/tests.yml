name: Tests
run-name: platform-build ${{ github.event.client_payload.build_id }}
on:
  push:
    paths-ignore:
      # Leading "**/" can never match a root-level file: GitHub's "**" matches
      # zero or more of ANY character, so "**/README.md" expands to "/README.md".
      - "**README.md"
  workflow_dispatch:
    inputs:
      modules:
        description: 'Modules to test (comma-separated, e.g. "chat,user,captchas-turnstile") or "all". Testable modules are the keys of module-config in the detect-changes job.'
        required: false
        default: 'all'
        type: string
  repository_dispatch:
    types: [ platform-build ]

jobs:
  pre_job:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        if: github.event_name != 'repository_dispatch'
        uses: fkirc/skip-duplicate-actions@master
        with:
          github_token: ${{ github.token }}
          # micromatch semantics here (unlike the workflow-level paths-ignore
          # above): "**/" matches zero or more directories, so this does match
          # a root-level README.md.
          paths_ignore: '["**/README.md"]'
          # Listing "push" here disabled de-duplication for the trigger that
          # produces nearly every run, making this job a no-op. Mirrors the
          # action's own default, pinned explicitly since it tracks @master.
          do_not_skip: '["workflow_dispatch", "schedule", "merge_group"]'

  detect-changes:
    needs: pre_job
    if: ${{ github.event_name == 'workflow_dispatch' || needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    outputs:
      changed-modules: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          base: ${{ github.event.before }}
          ref: ${{ github.event.after }}
          filters: |
            captchas:
              - 'pos-module-captchas/**'
            captchas-hcaptcha:
              - 'pos-module-captchas-hcaptcha/**'
            captchas-recaptcha:
              - 'pos-module-captchas-recaptcha/**'
            captchas-recaptcha3:
              - 'pos-module-captchas-recaptcha3/**'
            captchas-turnstile:
              - 'pos-module-captchas-turnstile/**'
            chat:
              - 'pos-module-chat/**'
            common-styling:
              - 'pos-module-common-styling/**'
            data-export-api:
              - 'pos-module-data-export-api/**'
            oauth-facebook:
              - 'pos-module-oauth-facebook/**'
            oauth-github:
              - 'pos-module-oauth-github/**'
            oauth-google:
              - 'pos-module-oauth-google/**'
            openai:
              - 'pos-module-openai/**'
            payments:
              - 'pos-module-payments/**'
            payments-stripe:
              - 'pos-module-payments-stripe/**'
            payments-example-gateway:
              - 'pos-module-payments-example-gateway/**'
            reports:
              - 'pos-module-reports/**'
            user:
              - 'pos-module-user/**'

      - name: Set matrix for changed modules
        id: set-matrix
        run: |
          # Define module configurations.
          # Playwright suites run through npm scripts; Liquid suites (app/lib/test/**) run
          # through the tests module with `pos-cli test run ci` - the positional environment
          # name is ignored because MPKIT_URL/MPKIT_EMAIL/MPKIT_TOKEN in the job env win.
          # Modules absent from this map have no suite wired up yet (core, push-notifications,
          # user-invites) or only ship example suites (tests). A paths-filter hit with no
          # entry here is dropped, so filters and this map must be kept in step.
          cat > /tmp/module-config.json << 'EOF'
          {
            "captchas": {
              "module": "captchas",
              "path": "pos-module-captchas",
              "deploy-script": "pos-cli data clean --include-schema --auto-confirm\npos-cli modules install --dev\npos-cli deploy",
              "test-commands": "pos-cli test run ci"
            },
            "captchas-hcaptcha": {
              "module": "captchas-hcaptcha",
              "path": "pos-module-captchas-hcaptcha",
              "deploy-script": "pos-cli data clean --include-schema --auto-confirm\npos-cli modules install --dev\npos-cli deploy",
              "test-commands": "pos-cli test run ci"
            },
            "captchas-recaptcha": {
              "module": "captchas-recaptcha",
              "path": "pos-module-captchas-recaptcha",
              "deploy-script": "pos-cli data clean --include-schema --auto-confirm\npos-cli modules install --dev\npos-cli deploy",
              "test-commands": "pos-cli test run ci"
            },
            "captchas-recaptcha3": {
              "module": "captchas-recaptcha3",
              "path": "pos-module-captchas-recaptcha3",
              "deploy-script": "pos-cli data clean --include-schema --auto-confirm\npos-cli modules install --dev\npos-cli deploy",
              "test-commands": "pos-cli test run ci"
            },
            "captchas-turnstile": {
              "module": "captchas-turnstile",
              "path": "pos-module-captchas-turnstile",
              "deploy-script": "pos-cli data clean --include-schema --auto-confirm\npos-cli modules install --dev\npos-cli deploy",
              "test-commands": "pos-cli test run ci"
            },
            "chat": {
              "module": "chat",
              "path": "pos-module-chat",
              "deploy-script": "./tests/data/seed/seed.sh",
              "test-commands": "npm run pw-tests"
            },
            "common-styling": {
              "module": "common-styling",
              "path": "pos-module-common-styling",
              "deploy-script": "pos-cli data clean --include-schema --auto-confirm\npos-cli deploy",
              "test-commands": "npm run pw-tests"
            },
            "data-export-api": {
              "module": "data-export-api",
              "path": "pos-module-data-export-api",
              "deploy-script": "./tests/data/seed/seed.sh",
              "test-commands": "npm run api-tests"
            },
            "oauth-facebook": {
              "module": "oauth-facebook",
              "path": "pos-module-oauth-facebook",
              "deploy-script": "./tests/data/seed/seed.sh",
              "test-commands": "npm run api-tests"
            },
            "oauth-github": {
              "module": "oauth-github",
              "path": "pos-module-oauth-github",
              "deploy-script": "./tests/data/seed/seed.sh",
              "test-commands": "npm run api-tests"
            },
            "oauth-google": {
              "module": "oauth-google",
              "path": "pos-module-oauth-google",
              "deploy-script": "./tests/data/seed/seed.sh",
              "test-commands": "npm run api-tests"
            },
            "openai": {
              "module": "openai",
              "path": "pos-module-openai",
              "deploy-script": "./tests/data/seed/seed.sh",
              "test-commands": "npm run pw-tests"
            },
            "payments-stripe": {
              "module": "payments-stripe",
              "path": "pos-module-payments-stripe",
              "deploy-script": "./tests/data/seed/seed.sh",
              "test-commands": "npm run api-tests"
            },
            "payments": {
              "module": "payments",
              "path": "pos-module-payments",
              "deploy-script": "./tests/data/seed/seed.sh",
              "test-commands": "npm run api-tests"
            },
            "payments-example-gateway": {
              "module": "payments-example-gateway",
              "path": "pos-module-payments-example-gateway",
              "deploy-script": "./tests/data/seed/seed.sh",
              "test-commands": "npm run pw-tests"
            },
            "reports": {
              "module": "reports",
              "path": "pos-module-reports",
              "deploy-script": "./tests/data/seed/seed.sh",
              "test-commands": "npm run pw-tests"
            },
            "user": {
              "module": "user",
              "path": "pos-module-user",
              "deploy-script": "./tests/data/seed/seed.sh",
              "test-commands": "npm run admin-panel-pw-tests\nnpm run pw-tests"
            }
          }
          EOF

          # Check if this is a manual trigger
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger detected"
            manual_input="${{ github.event.inputs.modules }}"
            echo "Manual input: $manual_input"

            if [ "$manual_input" = "all" ] || [ -z "$manual_input" ]; then
              # Test every module in the config - derived, so adding a module needs no edit here
              modules=$(jq -c '[.[]]' /tmp/module-config.json)
            else
              # Parse comma-separated list, strip pos-module- prefix, and map to configurations
              modules=$(echo "$manual_input" | \
                jq -R -c 'split(",") | map(gsub("^\\s+|\\s+$"; "") | gsub("^pos-module-"; ""))' | \
                jq -c --slurpfile config /tmp/module-config.json \
                'map(. as $m | $config[0][$m] | select(. != null))')
            fi
            echo "Manual trigger modules: $modules"
          else
            # Automatic detection from git changes
            changes='${{ steps.filter.outputs.changes }}'
            echo "Detected changes: $changes"

            # Extract changed modules and map to their configurations
            modules=$(jq -nc --argjson changes "$changes" --slurpfile config /tmp/module-config.json \
              '$changes | map(. as $m | $config[0][$m] | select(. != null))')
            echo "Changed modules matrix: $modules"
          fi

          echo "matrix=$modules" >> $GITHUB_OUTPUT

  run-tests:
    needs: detect-changes
    if: |
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.changed-modules != '[]'
    runs-on: ubuntu-latest
    container: ${{ vars.PW_CONTAINER }}
    strategy:
      matrix:
        include: ${{ fromJSON(needs.detect-changes.outputs.changed-modules) }}
      max-parallel: 1
      fail-fast: false
    timeout-minutes: 60
    env:
      CI: true
      MPKIT_EMAIL: ${{ secrets.MPKIT_EMAIL }}
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      STRIPE_SK_KEY: ${{ secrets.STRIPE_SK_KEY }}
      HTML_ATTACHMENTS_BASE_URL: ${{ vars.HTML_ATTACHMENTS_BASE_URL }}
      TEST_REPORT_MPKIT_URL: ${{ vars.TEST_REPORT_MPKIT_URL }}
      TEST_REPORT_MPKIT_TOKEN: ${{ secrets.TEST_REPORT_MPKIT_TOKEN }}
    steps:
      - name: Reserve CI instance
        id: reserve
        uses: Platform-OS/ci-repository-reserve-instance-url@0.1.2
        with:
          repository-url: ${{ vars.CI_PS_REPOSITORY_URL }}
          method: reserve
          pos-ci-repo-token: ${{ secrets.POS_CI_PS_REPO_ACCESS_TOKEN }}

      - name: Get MPKIT token
        id: get-token
        uses: Platform-OS/ci-repository-reserve-instance-url@0.1.2
        with:
          method: get-token
          repository-url: ${{ vars.CI_PS_REPOSITORY_URL }}
          pos-ci-repo-token: ${{ secrets.POS_CI_PS_REPO_ACCESS_TOKEN }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Deploy module
        timeout-minutes: 10
        shell: sh
        env:
          MPKIT_URL: ${{ steps.reserve.outputs.mpkit-url }}
          MPKIT_TOKEN: ${{ steps.get-token.outputs.mpkit-token }}
        working-directory: ${{ matrix.path }}
        run: |
          set -eu
          ${{ matrix.deploy-script }}

      - name: Run tests
        shell: sh
        env:
          MPKIT_URL: ${{ steps.reserve.outputs.mpkit-url }}
          MPKIT_TOKEN: ${{ steps.get-token.outputs.mpkit-token }}
        working-directory: ${{ matrix.path }}
        run: |
          set -eu
          ${{ matrix.test-commands }}

      - name: Release CI instance
        if: always()
        uses: Platform-OS/ci-repository-reserve-instance-url@0.1.2
        with:
          method: release
          repository-url: ${{ vars.CI_PS_REPOSITORY_URL }}
          pos-ci-repo-token: ${{ secrets.POS_CI_PS_REPO_ACCESS_TOKEN }}

  conclusion:
    needs: [detect-changes, run-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate workflow summary
        run: |
          if [ "${{ needs.detect-changes.outputs.changed-modules }}" = "[]" ] || [ "${{ needs.detect-changes.result }}" = "skipped" ]; then
            echo "## Tests - Skipped" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ "${{ needs.detect-changes.result }}" = "skipped" ]; then
              echo "Workflow was skipped by duplicate action check." >> $GITHUB_STEP_SUMMARY
            elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "Manual trigger with no matching modules selected." >> $GITHUB_STEP_SUMMARY
            else
              echo "No modules with tests were changed in this push." >> $GITHUB_STEP_SUMMARY
            fi
          else
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "## Tests - Completed (Manual Trigger)" >> $GITHUB_STEP_SUMMARY
            else
              echo "## Tests - Completed" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Tests ran for the following modules:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo '${{ needs.detect-changes.outputs.changed-modules }}' | jq -r '.[] | "- " + .module' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ "${{ needs.run-tests.result }}" = "success" ]; then
              echo "Result: All tests passed" >> $GITHUB_STEP_SUMMARY
            elif [ "${{ needs.run-tests.result }}" = "skipped" ]; then
              echo "Result: Tests were skipped" >> $GITHUB_STEP_SUMMARY
            else
              echo "Result: Some tests failed - check job output for details" >> $GITHUB_STEP_SUMMARY
            fi
          fi
