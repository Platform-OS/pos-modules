name: uploads
properties:
  - name: conversation_id
    type: string
  - name: uploader_id
    type: string
  - name: upload
    type: upload
    options:
      acl: private
      # enforced by S3 on the upload itself (the presigned policy's content-length-range), in KiB -
      # 10 MB, the limit the uploader and the inbox state (modules/chat/upload_drop.max_size)
      content_length:
        lte: 10240
  # JSON ({ type, name, size, width, height }) - platformOS has no JSON property type, so it's stored as
  # a string: written with value_json and read with property_json (see graphql/uploads)
  - name: metadata
    type: string