query oldest_by_participants($participant_ids: [String!]!) {
  conversations: records(
    per_page: 1
    filter: {
      table: { exact: "modules/chat/conversation" }
      properties: [{ name: "participant_ids", value_in: $participant_ids }]
    }
    sort: { id: { order: ASC } }
  ) {
    results {
      id
      participant_ids: property_array(name: "participant_ids")
    }
  }
}
