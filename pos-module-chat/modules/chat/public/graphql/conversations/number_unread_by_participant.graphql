query search(
  $participant_id: [String!]
) {
  conversations: records(
    per_page: 1
    filter: {
      table: { exact: "modules/chat/conversation" },
      properties: [
        { name: "participant_ids", array_contains: $participant_id }
        { name: "participant_read_ids", not_array_contains: $participant_id }
        # the same as the conversations list - one without a message yet (started by attaching
        # a file that never got sent) isn't listed, so it must not count as unread either
        { name: "last_message_at", exists: true }
      ]
    }
  ) {
    total_entries
  }
}
