query search_by_conversation($conversation_id: [String!]!, $limit: Int = 250) {
  uploads: records(
    per_page: $limit,
    filter: {
      table: { exact: "modules/chat/uploads" }
      properties: [
        { name: "conversation_id", value_in: $conversation_id }
      ]
    }
  ) {
    results {
      id
      conversation_id: property(name: "conversation_id")
      uploader_id: property(name: "uploader_id")
      metadata: property_json(name: "metadata")
      upload: property_upload(name: "upload", expires_in: 172800){
        file_name
        url
        versions
        extension
      }
    }
  }
}
