mutation create($conversation_id: String!, $message: String!, $autor_id: String!, $media: JSONPayload) {
  record_create(
    record: {
    table: "modules/chat/message"
    properties: [
      { name: "conversation_id", value: $conversation_id }
      { name: "message", value: $message }
      { name: "autor_id", value: $autor_id }
      { name: "media", value_json: $media }
    ]
    }
  ) {
    id
    properties
  }
}
