configuration:
  escape_output_instead_of_sanitize: true
  safe_translate: true
  slug_exact_match: true

# This repo is the source of truth for the captchas module and the fake test provider:
# let deploys delete files removed locally, so stale files on the instance can't mask
# breakage that a fresh install would hit.
modules_that_allow_delete_on_deploy:
  - captchas
  - captchas_test
