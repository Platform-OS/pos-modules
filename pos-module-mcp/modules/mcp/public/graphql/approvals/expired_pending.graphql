query expired_pending($now: String!, $per_page: Int!) {
  # Pending approvals whose window has closed (expires_at is unix seconds, an integer
  # property). approval/expire_due moves each to expired and attests it.
  records(
    per_page: $per_page
    filter: {
      table: { value: "modules/mcp/mcp_pending_approval" }
      properties: [
        { name: "status", value: "pending" }
        { name: "expires_at", range: { lt: $now } }
      ]
    }
    sort: [{ id: { order: ASC } }]
  ) {
    total_entries
    results {
      id
      handle: property(name: "handle")
    }
  }
}
