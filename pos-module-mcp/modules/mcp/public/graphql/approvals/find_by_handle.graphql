query find_by_handle($handle: String!) {
  records(
    per_page: 1
    filter: {
      table: { value: "modules/mcp/mcp_pending_approval" }
      properties: [{ name: "handle", value: $handle }]
    }
  ) {
    results {
      id
      handle: property(name: "handle")
      tool_name: property(name: "tool_name")
      tool_version: property(name: "tool_version")
      arguments_json: property(name: "arguments_json")
      input_sha256: property(name: "input_sha256")
      requested_by_agent: property(name: "requested_by_agent")
      principal_id: property(name: "principal_id")
      authz_policy: property(name: "authz_policy")
      status: property(name: "status")
      decided_by: property(name: "decided_by")
      decided_at: property(name: "decided_at")
      expires_at: property(name: "expires_at")
      result_summary: property(name: "result_summary")
      request_id: property(name: "request_id")
    }
  }
}
