mutation record_outcome(
  $id: ID!
  $status: String!
  $decided_by: String
  $decided_at: String
  $result_summary: String
  $result_json: String
  $error_json: String
) {
  record: record_update(id: $id, record: {
    table: "modules/mcp/mcp_pending_approval"
    properties: [
      { name: "status", value: $status }
      { name: "decided_by", value: $decided_by }
      { name: "decided_at", value: $decided_at }
      { name: "result_summary", value: $result_summary }
      { name: "result_json", value: $result_json }
      { name: "error_json", value: $error_json }
    ]
  }) {
    id
    status: property(name: "status")
  }
}
