mutation update(
  $id: ID!
  $role: String!
  $status: String!
  $decided_by: String
  $occurred_at: String!
) {
  record: record_update(id: $id, record: {
    properties: [
      { name: "role", value: $role }
      { name: "status", value: $status }
      { name: "decided_by", value: $decided_by }
      { name: "occurred_at", value: $occurred_at }
    ]
  }) {
    id
    status: property(name: "status")
  }
}
