mutation create_oauth(
  $user_id: String!
  $token_digest: String!
  $refresh_digest: String!
  $label: String!
  $client_id: String!
  $scope: String!
  $resource: String!
  $expires_at: Int!
  $refresh_expires_at: Int!
) {
  record: record_create(record: {
    table: "modules/mcp/mcp_token"
    properties: [
      { name: "user_id", value: $user_id }
      { name: "token_digest", value: $token_digest }
      { name: "refresh_digest", value: $refresh_digest }
      { name: "label", value: $label }
      { name: "status", value: "active" }
      { name: "kind", value: "oauth" }
      { name: "client_id", value: $client_id }
      { name: "scope", value: $scope }
      { name: "resource", value: $resource }
      { name: "expires_at", value_int: $expires_at }
      { name: "refresh_expires_at", value_int: $refresh_expires_at }
    ]
  }) {
    id
  }
}
