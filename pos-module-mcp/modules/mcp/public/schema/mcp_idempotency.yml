name: mcp_idempotency
# Idempotency cache (spec §16.3). For a tool declared `idempotent: true`, a
# client-supplied idempotency key lets a retry return the ORIGINAL result instead
# of re-executing — agents retry far more than humans, and without this a retried
# mutating call duplicates the write. Scoped per (key, principal): one member's key
# can never replay another's result. For mutating tools the row is written INSIDE
# the same transaction as the business mutation, so the mutation and its
# idempotency record commit or roll back together.
properties:
  - name: key            # client-supplied Idempotency-Key
  - name: principal_id   # the caller — scopes the key
  - name: tool_name
  - name: input_sha256   # guards against key reuse with different arguments
  - name: response_json
    type: text           # the cached MCP result (content + structuredContent)
  - name: expires_at
    type: integer        # unix epoch; entries past this are ignored (and swept)
