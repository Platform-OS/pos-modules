mutation (
  $room_id: String!
  $user_id: String!
) {
  record: record_create(
    record: {
      table: "modules/websocket/room_member"
      properties: [
        { name: "room_id", value: $room_id }
        { name: "user_id", value: $user_id }
      ]
    }
  ) {
    id
    room_id: property(name: "room_id")
    user_id: property(name: "user_id")
  }
}
