query (
  $room_id: String!
  $user_id: String!
) {
  records(
    per_page: 1
    filter: {
      table: { value: "modules/websocket/room_member" }
      properties: [
        { name: "room_id", value: $room_id }
        { name: "user_id", value: $user_id }
      ]
    }
  ) {
    total_entries
  }
}
