mutation create_login_attempt(
  $user_id: String!
  $failed_login_attempts: Int!
  $locked_until: String!
) {
  record: record_create(
    record: {
      table: "modules/user/login_attempt"
      properties: [
        { name: "user_id", value: $user_id }
        { name: "failed_login_attempts", value_int: $failed_login_attempts }
        { name: "locked_until", value: $locked_until }
      ]
    }
  ) {
    id
    user_id: property(name: "user_id")
    failed_login_attempts: property_int(name: "failed_login_attempts")
    locked_until: property(name: "locked_until")
  }
}
